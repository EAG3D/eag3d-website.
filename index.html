<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAG3D | Product Catalog</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
}
header {
  background: #191919;
  padding: 0;
  text-align: center;
  border-bottom: 3px solid #e0a326;
}
header .logo {
  display: block;
  width: 100%;
  height: auto;
  max-height: none;
  object-fit: contain;
  margin: 0 auto;
}
header p { color: #bbb; }
main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px;
}
h2 {
  border-bottom: 1px solid #444;
  padding-bottom: 10px;
}
#products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}
.product {
  background: #202020;
  border: 1px solid #383838;
  border-radius: 8px;
  overflow: hidden;
}
.product img {
  width: 100%;
  height: 280px;
  object-fit: contain;
  background: #292929;
  padding: 10px;
}
.details { padding: 15px; }
.details h3 { margin-top: 0; }
.price {
  color: #e0a326;
  font-size: 20px;
  font-weight: bold;
}
.order-button {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #e0a326;
  color: #111;
  text-align: center;
  text-decoration: none;
  font-weight: bold;
  border-radius: 5px;
}
.order-button:hover {
  background: #f2bd48;
}.description {
  color: #ccc;
  line-height: 1.5;
  white-space: pre-wrap;
}
footer {
  text-align: center;
  padding: 25px;
  color: #999;
  background: #191919;
  margin-top: 35px;
}
a { color: #e0a326; }
</style>
</head>
<body>
<header>
  <img class="logo" src="/media/grok_1786308239597.jpg" alt="EAG3D Logo">
  <p>Precision 3D Printing &amp; Custom Solutions</p>
</header>

<main>
  <h2>Product Catalog</h2>
  <div id="products">Loading products...</div>
</main>

<section style="text-align:center; padding:25px 15px; background:#202020; border-top:2px solid #e0a326; margin-top:30px;">
  <h2 style="color:#e0a326; border-bottom:none;">SHIPPING TIMES</h2>
  <p style="color:#ccc; line-height:1.6; max-width:800px; margin:auto;">
    All orders are print-to-order. Please allow up to 1 week for your order to be completed. Orders will be shipped the same week they are completed.
  </p>
</section>

<footer>


  <p>Questions or custom orders?</p>
  <p><a href="mailto:eliteairgunneryt@protonmail.com">Contact EAG3D</a></p>
  <p>© EAG3D</p>
</footer>

<script>
const repo = "EAG3D/eag3d-website.";

async function loadProducts() {
  const container = document.getElementById("products");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${repo}/contents/products`
    );

    if (!response.ok) throw new Error("Could not load products.");

    const files = await response.json();
    container.innerHTML = "";

    for (const file of files) {
      if (!file.name.endsWith(".md")) continue;

      const fileResponse = await fetch(file.download_url);
      const markdown = await fileResponse.text();
      const match = markdown.match(/^---\s*\n([\s\S]*?)\n---/);

      if (!match) continue;

      const product = jsyaml.load(match[1]) || {};
      const card = document.createElement("article");
      card.className = "product";

      if (product.image) {
        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.title || "Product photo";
        card.appendChild(img);
      }

      const details = document.createElement("div");
      details.className = "details";

      const title = document.createElement("h3");
      title.textContent = product.title || "Untitled";
      details.appendChild(title);

      if (product.price) {
        const price = document.createElement("p");
        price.className = "price";
        price.textContent = product.price;
        details.appendChild(price);
      }

      if (product.description) {
        const description = document.createElement("p");
        description.className = "description";
        description.textContent = product.description;
        details.appendChild(description);
      }
const orderButton = document.createElement("button");
orderButton.className = "order-button";
orderButton.textContent = "CONTACT TO ORDER";
orderButton.type = "button";
orderButton.style.border = "0";
orderButton.style.cursor = "pointer";
orderButton.style.fontSize = "16px";
orderButton.style.fontFamily = "inherit";

const options = document.createElement("div");
options.hidden = true;
options.style.marginTop = "10px";

const callLink = document.createElement("a");
callLink.href = "sms:+15743347562";
callLink.textContent = "TEXT: (574) 334-7562";
const emailLink = document.createElement("a");
emailLink.href = "mailto:eliteairgunneryt@protonmail.com?subject=" +
  encodeURIComponent("Order Inquiry: " + (product.title || "Product"));
emailLink.textContent = "EMAIL EAG3D";

for (const link of [callLink, emailLink]) {
  link.style.display = "block";
  link.style.padding = "12px";
  link.style.marginTop = "8px";
  link.style.background = "#292929";
  link.style.borderRadius = "5px";
  link.style.textDecoration = "none";
}

options.appendChild(callLink);
options.appendChild(emailLink);

orderButton.addEventListener("click", () => {
  options.hidden = !options.hidden;
});
const paypalLink = document.createElement("a");
paypalLink.className = "order-button";
paypalLink.href = "https://www.paypal.me/BennyLo420";
paypalLink.target = "_blank";
paypalLink.rel = "noopener noreferrer";
paypalLink.textContent = "PAY WITH PAYPAL";
details.appendChild(paypalLink);
details.appendChild(orderButton);
details.appendChild(options);
     card.appendChild(details); container.appendChild(card);
    }

    if (!container.children.length) {
      container.textContent = "No products have been added yet.";
    }
  } catch (error) {
    container.textContent =
      "Products could not be loaded. Please try again later.";
  }
}

loadProducts();
</script>
</body>
</html>
